<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts </title>

    <style>
       body {
          background-color: #f0f2f5;
          font-family: Helvetica, Arial, sans-serif;
       }

       form {
          min-height: 180px;
       }

       article, form {
          background-color: #ffffff;
          border-radius: 8px;
          box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
          padding: 12px 16px;
          margin-bottom: 16px;
          max-width: 680px;
          margin-left: auto;
          margin-right: auto;
       }

       h2 {
          color: #050505;
          font-size: 0.9375rem;
          font-weight: 600;
          margin: 0 0 4px 0;
       }

       p {
          color: #050505;
          font-size: 0.9375rem;
          line-height: 1.3333;
          margin: 8px 0 0 0;
       }
    </style>
</head>

<body>
<h1> Welcome to my Posts page! </h1>

    <form action="#">

        <label for="userID">Select User:</label>
        <select id="userID">
            <option value="">--Please choose an option--</option>
            <option value="1">User 1</option>
            <option value="2">User 2</option>
            <option value="3">User 3</option>
            <option value="4">User 4</option>
            <option value="5">User 5</option>
            <option value="6">User 6</option>
            <option value="7">User 7</option>
        </select>

        <button type="button" id="filterBtn">Filter</button>

        <br><br>

        <label for="displayUserID">Enter User ID:</label>
        <input type="number" id="displayUserID" min="1" max="10">

        <button type="button" id="displayUserBtn">Display User Posts</button>

        <br><br>

        <label for="postID">Enter Post ID:</label>
        <input type="number" id="postID" min="1" max="100">

        <button type="button" id="findBtn">Find</button>

    </form>

    <script>
        const site = 'https://jsonplaceholder.typicode.com/posts';

        let posts = [];

        const clearPosts = () => {
            document.querySelectorAll('article').forEach((article) => {
                article.remove();
            });
        };

        const displayPost = (post) => {
            let article = document.createElement('article');

            let h2 = document.createElement('h2');
            h2.textContent = post.title;

            let ids = document.createElement('p');
            ids.textContent = `User ID: ${post.userId} | Post ID: ${post.id}`;

            let p = document.createElement('p');
            p.textContent = post.body;

            article.append(h2);
            article.append(ids);
            article.append(p);
            document.body.appendChild(article);
        };

        const displayPosts = (list) => {
            for (let i = 0; i < list.length; i++) {
                displayPost(list[i]);
            }
        };

        const getinfo = async () => {
            try {
                let response = await fetch(site);
                posts = await response.json();

                console.table(posts);

                displayPosts(posts);
            } catch (reason) {
                console.log(reason);
            }
        };

        document.getElementById('filterBtn').addEventListener('click', function () {
            let uid = Number(document.getElementById('userID').value);

            if (!uid) {
                console.log('Please choose a user.');
                return;
            }

            let filtered = posts.filter((post) => post.userId === uid);
            console.table(filtered);
        });

        document.getElementById('displayUserBtn').addEventListener('click', function () {
            let uid = Number(document.getElementById('displayUserID').value);

            clearPosts();

            if (uid < 1 || uid > 10) {
                let article = document.createElement('article');
                article.textContent = 'Please enter a User ID from 1 to 10.';
                document.body.appendChild(article);
                return;
            }

            let userPosts = posts.filter((post) => post.userId === uid);
            displayPosts(userPosts);
        });

        document.getElementById('findBtn').addEventListener('click', function () {
            let pid = Number(document.getElementById('postID').value);

            clearPosts();

            let found = posts.find((post) => post.id === pid);

            if (found) {
                displayPost(found);
            } else {
                let article = document.createElement('article');
                article.textContent = `Post ${pid || ''} not found.`;
                document.body.appendChild(article);
            }
        });

        getinfo();
    </script>

</body>
</html>
