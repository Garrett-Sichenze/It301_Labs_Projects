<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab12</title>
</head>
<body>
    <form action="#">
        <label for="name">What is your name? </label>
        <input type="string" id="name"> <br> <br>
        <button id="button" type="button">Submit</button>
    </form>
    <p id="result"></p>

    <p>Basic Calculator</p>
    <form action="#">
        <label for="num1">First Number </label>
        <input type="number" id="num1"> <br>
        <button id="button1" type="button">Submit</button>
    </form>

    <form action="#">
        <label for="num2">Second Number </label>
        <input type="number" id="num2"> <br>
        <button id="button2" type="button">Submit</button>
    </form>    

    <form action="#">
        <input type="radio" name="action" value="add">Add<br>
        <input type="radio" name="action" value="sub">Subtract<br>
        <input type="radio" name="action" value="mult">Multiply<br>
        <input type="radio" name="action" value="div">Divide<br>

        <button id="select" type="button">Select</button>
    </form>
    <p id="calc_result"></p> <br> <br>
    <button id="calculate" type="button">Calculate</button>
    <button id="clear" type="button">Clear</button>
    <script>

    const add = (a, b) => a + b;
    const sub = (a, b) => a - b;
    const mult = (a, b) => a * b;
    const div = (a, b) => a / b;

    const actions = { add, sub, mult, div };

    const result = document.getElementById('result');
    const name = document.getElementById('name');
    const num1 = document.getElementById('num1');
    const num2 = document.getElementById('num2');
    const calc_result = document.getElementById('calc_result');

    let chosenAction = null;

    document.getElementById('button').addEventListener('click', function(){
        result.textContent = `Hello ${name.value}`;
    });

    document.getElementById('button2').addEventListener('click', function(){
        console.log('Second number:', num2.value);
    });

    document.getElementById('select').addEventListener('click', function(){
        const selected = document.querySelector('[name="action"]:checked');
        chosenAction = selected ? selected.value : null;
        console.log(chosenAction);
    });

    document.getElementById('calculate').addEventListener('click', function(){
        if (!chosenAction) {
            calc_result.textContent = 'Please select an action first';
            return;
        }

        const a = Number(num1.value);
        const b = Number(num2.value);

        if (chosenAction === 'div' && b === 0) {
            calc_result.textContent = 'Cannot divide by zero';
            return;
        }

        calc_result.textContent = actions[chosenAction](a, b);
    });

    document.getElementById('clear').addEventListener('click', function(){
        num1.value = '';
        num2.value = '';
        calc_result.textContent = '';
        chosenAction = null;
        document.querySelectorAll('[name="action"]').forEach(r => r.checked = false);
    });
    </script>
    
</body>
</html>
