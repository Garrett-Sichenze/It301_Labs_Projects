<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab10</title>
</head>
<body>
    <script>
        let promptMsg = 'Please enter the total restaurant bill amount:';
        let bill;

        do {
            let input = prompt(promptMsg);

            if (input === null || input.trim() === "") {
                promptMsg = "Please enter a bill amount greater than zero.";
                bill = NaN;
            } else if (isNaN(input)) {
                promptMsg = "Invalid input. Please enter a numeric bill amount.";
                bill = NaN;
            } else {
                bill = Number(input);
                if (bill === 0) {
                    promptMsg = "Please enter a bill amount greater than zero.";
                } else if (bill < 0) {
                    promptMsg = "Negative amounts are not allowed. Please enter a valid bill amount.";
                } else {
                    // Valid input! Calculate and display inside the loop
                    let tip = bill * 0.10;
                    let result = "For a bill of $" + bill.toFixed(2) + ", the tip should be $" + tip.toFixed(2) + ".";

                    console.log(result);
                    document.write(result);
                }
            }
        } while (isNaN(bill) || bill <= 0);
    </script>
</body>
</html>
