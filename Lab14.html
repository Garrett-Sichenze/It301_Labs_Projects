<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab14</title>
</head>
<body>
    
    <script>
        const site = 'https://randomuser.me/api/';
        let img = document.createElement('img');
        let info = document.createElement('div');

        let bttn = document.createElement('button');
        bttn.type = 'button';
        bttn.textContent = 'Create Profile';

        let form = document.createElement('form');
        form.action = '#';

        form.appendChild(bttn);
        document.body.appendChild(form);

        const getinfo = async()=>{
            try{
            let result = await fetch(site);
            result = await result.json();
            console.log(result);
            img.src = result.results[0].picture.medium;
            img.alt = 'Profile Picture';
            document.body.appendChild(img);
            let name = result.results[0].name.first;
            let email = result.results[0].email;
            let phoneNum = result.results[0].phone;
            info.innerHTML = name + '<br>' + email + '<br>' + phoneNum;
            document.body.appendChild(info);

            console.log(name);
            console.log(email);
            console.log(phoneNum);
            
        }catch{(reason)=>console.log(reason);}
        };
        bttn.addEventListener('click', getinfo);
    </script>
</body>
</html>
