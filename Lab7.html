<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab7</title>
    <style>
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body{
            display: flex;
            height: 100vh;
        }

        #right_parent{
            display: flex;
            width: 80vh;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: flex-end;
            overflow-y:auto;

        }

        div img{
            border: solid white 1px;
            flex-shrink: 5;
            display: flex;
            flex-grow: 1;
            flex-shrink: 1;
            height: 100px;
        }

        #left_parent{
            background-color: orange;
            height: 100vh;
            width: 15vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            overflow-y:auto;
            flex-shrink: 0;

        }


        div p{
            font-size: 32px;
            display: flex;
            justify-content: center;
            height: 100vh;
            margin: 0vh;
        }

        div p:nth-child(4){
            display: flex;
            margin-top: 50vh;
        }
    </style>
</head>
<body>
    <div id="left_parent">
        <p>&#x1F4F7;</p>
        <p>&#x1F5C4;&#xfe0f;</p>
        <p>&#x2764;&#xfe0f;</p>
